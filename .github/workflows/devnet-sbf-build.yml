name: Compile non-deployed Solana devnet sandbox ELF
on:
  push:
    branches: [main]
    paths:
      - 'devnet/**'
      - '.github/workflows/devnet-sbf-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install official Solana CLI build tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build Solana program into ELF, no network deployment
        run: |
          mkdir -p artifacts/sbf
          cargo build-sbf --manifest-path devnet/programs/fable_devnet_options/Cargo.toml --sbf-out-dir artifacts/sbf
          test -s artifacts/sbf/fable_devnet_options.so
          sha256sum artifacts/sbf/fable_devnet_options.so
      - name: Upload unaudited devnet-only executable for future local tests
        uses: actions/upload-artifact@v4
        with:
          name: fable-devnet-sandbox-sbf
          path: artifacts/sbf/fable_devnet_options.so
          retention-days: 3
