name: Cache Pump.fun demo coin artwork (no wallet or trading)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-pump-art.yml'
      - '.github/scripts/cache-pump-art.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified-mint Pump.fun coin artwork
        run: node .github/scripts/cache-pump-art.mjs
      - name: Commit only static coin images and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/coin-art/
          if git diff --cached --quiet; then
            echo "Coin artwork unchanged."
          else
            git commit -m "Cache exact-mint Pump.fun token artwork for Fable preview"
            git push origin HEAD:main
          fi
