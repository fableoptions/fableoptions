name: Validate Fable backend
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fable_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: fable_rfq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fable_test -d fable_rfq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fable_test:local_test_only@127.0.0.1:5432/fable_rfq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --check web/app.js
      - run: npm test
      - run: npm run test:rfq-integration
