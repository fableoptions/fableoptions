name: Public Solana devnet Fable options test (disposable test tokens)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  devnet-test:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install official Solana CLI and SBF tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Create disposable program and isolated DEVNET payer
        env:
          FABLE_DEVNET_TEST_PAYER_B64: ${{ secrets.FABLE_DEVNET_TEST_PAYER_B64 }}
        run: |
          set -euo pipefail
          solana-keygen new --silent --no-bip39-passphrase --force -o "$RUNNER_TEMP/fable-devnet-program.json"
          # Optional dedicated DEVNET-ONLY fee payer in masked Actions secret.
          # Never commit, upload as artifact, or print its private bytes.
          if [ -n "$FABLE_DEVNET_TEST_PAYER_B64" ]; then
            (umask 077; printf '%s' "$FABLE_DEVNET_TEST_PAYER_B64" | base64 --decode > "$RUNNER_TEMP/fable-devnet-payer.json")
            node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(p)||p.length!==64||!p.every(n=>Number.isInteger(n)&&n>=0&&n<=255))process.exit(1)' "$RUNNER_TEMP/fable-devnet-payer.json"
            echo "Using dedicated devnet-only secret-backed test payer."
          else
            solana-keygen new --silent --no-bip39-passphrase --force -o "$RUNNER_TEMP/fable-devnet-payer.json"
            echo "Using disposable payer; public faucet funding required."
          fi
          PROGRAM_ID="$(solana address -k "$RUNNER_TEMP/fable-devnet-program.json")"
          PAYER_ID="$(solana address -k "$RUNNER_TEMP/fable-devnet-payer.json")"
          sed -i "s/Fg6PaFpoGXkYsidMpWxqSWYKuD8D7j7XQyVd7U5g4bD/$PROGRAM_ID/g" devnet/programs/fable_devnet_options/src/lib.rs devnet/Anchor.toml
          echo "FABLE_TEST_PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          echo "FABLE_TEST_PAYER_KEYPAIR=$RUNNER_TEMP/fable-devnet-payer.json" >> "$GITHUB_ENV"
          echo "PUBLIC_DEVNET_PROGRAM_ID=$PROGRAM_ID"
          echo "PUBLIC_DEVNET_FEE_PAYER=$PAYER_ID"
          echo "Temporary program key created; no mainnet keys or real USDC."
      - name: Fund DEVNET test payer from free faucets (browser assist allowed)
        run: |
          set -euo pipefail
          RPC=https://api.devnet.solana.com
          solana cluster-version --url "$RPC"
          solana config set --url "$RPC" --keypair "$FABLE_TEST_PAYER_KEYPAIR"
          echo "::notice::Public DEVNET-only test wallet: $(solana address -k "$FABLE_TEST_PAYER_KEYPAIR")"
          echo "::notice::If CLI airdrop is rate-limited, use your own browser to request about 3 free DEVNET SOL for that PUBLIC ADDRESS; never send real SOL."
          for attempt in 1 2; do
            solana airdrop 2 --url "$RPC" --keypair "$FABLE_TEST_PAYER_KEYPAIR" || true
          done
          # If runner IP is rate-limited, let the human fund this disposable
          # public address with the official DEVNET faucet in their browser.
          # Never ask for / display a private key. This is a manual opt-in run.
          FUNDED=0
          for round in $(seq 1 24); do
            LAMPORTS="$(solana balance --lamports --url "$RPC" --keypair "$FABLE_TEST_PAYER_KEYPAIR" | tr -dc '0-9')"
            if [ -n "$LAMPORTS" ] && [ "$LAMPORTS" -ge 2500000000 ]; then
              FUNDED=1
              echo "Free DEVNET funding received: $LAMPORTS lamports."
              break
            fi
            echo "Devnet wallet funding not yet available (check $round/24)."
            sleep 25
          done
          if [ "$FUNDED" -ne 1 ]; then
            echo "::error::PUBLIC_DEVNET_FUNDING_UNAVAILABLE: 2.5 devnet SOL minimum. No deployment attempted."
            exit 2
          fi
      - name: Build executable with disposable program ID
        run: |
          set -euo pipefail
          mkdir -p artifacts/devnet
          cargo build-sbf --manifest-path devnet/programs/fable_devnet_options/Cargo.toml --sbf-out-dir artifacts/devnet
          test -s artifacts/devnet/fable_devnet_options.so
          sha256sum artifacts/devnet/fable_devnet_options.so
      - name: Deploy only to public Solana DEVNET
        run: |
          set -euo pipefail
          RPC=https://api.devnet.solana.com
          solana program deploy artifacts/devnet/fable_devnet_options.so \
            --url "$RPC" \
            --keypair "$FABLE_TEST_PAYER_KEYPAIR" \
            --program-id "$RUNNER_TEMP/fable-devnet-program.json"
          solana program show "$FABLE_TEST_PROGRAM_ID" --url "$RPC"
          echo "Deployment verified on Solana DEVNET program: $FABLE_TEST_PROGRAM_ID"
      - name: Execute fake test-USDC option contract on DEVNET
        run: |
          npm install --no-audit --no-fund
          npx tsx devnet/scripts/public-devnet-smoke.ts
      - name: Finalize results and discard temporary deployment identities
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fable-devnet-program.json" "$RUNNER_TEMP/fable-devnet-payer.json"
          echo "Temporary signing keys removed from runner."
